[phases.setup]
nixPkgs = ['php83', 'php83Extensions.pdo_mysql', 'php83Extensions.mbstring', 'php83Extensions.bcmath', 'composer', 'nodejs_20']

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm ci || npm install',
    'npm run build'
]

[start]
cmd = 'php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
